# A deliberately broken namespace: one of every common failure.
# kubectl apply -f examples/broken-shop.yaml, then ask your agent "what's wrong in demo-shop?"
apiVersion: v1
kind: Namespace
metadata:
  name: demo-shop
---
# Crashes on boot and prints a credential on the way down (the server redacts it).
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: demo-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo booting api v2; echo DB_PASSWORD=hunter2; echo 'FATAL: could not connect to postgres://app:hunter2@db:5432/shop'; exit 1"]
---
# Allocates more memory than its limit.
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: demo-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "head -c 300m /dev/zero | tail"]
          resources: {limits: {memory: 32Mi}}
---
# Tag that was never pushed.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: demo-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: busybox:9.9.9-does-not-exist
---
# Asks for more memory than any node has.
apiVersion: apps/v1
kind: Deployment
metadata: {name: batch, namespace: demo-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: batch}}
  template:
    metadata: {labels: {app: batch}}
    spec:
      containers:
        - name: batch
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources: {requests: {memory: 500Gi}}
---
# Running, but nothing listens on the readiness port: gets no traffic.
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: demo-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
# Needs a Secret nobody created.
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments, namespace: demo-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments}}
  template:
    metadata: {labels: {app: payments}}
    spec:
      containers:
        - name: payments
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
            - name: STRIPE_KEY
              valueFrom: {secretKeyRef: {name: payments-creds, key: stripe}}
---
# The one healthy service.
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: demo-shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
        - name: catalog
          image: busybox:1.36
          command: ["sleep", "3600"]
