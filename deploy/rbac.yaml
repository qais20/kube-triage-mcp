# Read-only by default. No access to Secrets or ConfigMaps: the server can't read
# what it isn't allowed to leak.
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-triage, namespace: kube-triage}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kube-triage-read}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kube-triage-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-triage-read}
subjects: [{kind: ServiceAccount, name: kube-triage, namespace: kube-triage}]
---
# Optional: allow restart/scale in ONE namespace. Bind per namespace, never cluster-wide.
# The server still needs --allow-writes, and every change still needs a human-approved token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kube-triage-write, namespace: demo-shop}
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kube-triage-write, namespace: demo-shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kube-triage-write}
subjects: [{kind: ServiceAccount, name: kube-triage, namespace: kube-triage}]
