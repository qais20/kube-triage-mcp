<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 448" width="980" height="448" role="img" aria-label="Claude triaging a broken Kubernetes namespace with kube-triage-mcp">
<rect width="980" height="448" rx="12" fill="#0d1117" stroke="#30363d"/>
<circle cx="24" cy="22" r="6" fill="#f85149"/><circle cx="44" cy="22" r="6" fill="#d29922"/><circle cx="64" cy="22" r="6" fill="#3fb950"/>
<text x="490.0" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">claude · kube-triage-mcp · kind cluster</text>
<line x1="0" y1="44" x2="980" y2="44" stroke="#30363d"/>
<text x="32" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">claude </tspan><tspan fill="#a5d6ff">&quot;users say the shop is broken. what&#x27;s wrong in demo-shop?&quot;</tspan></text>
<text x="32" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#3fb950">⏺ </tspan><tspan fill="#e6edf3">kube-triage</tspan><tspan fill="#8b949e"> · triage(namespace=&quot;demo-shop&quot;)</tspan></text>
<text x="32" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#f85149">  ● </tspan><tspan fill="#e6edf3">payments   </tspan><tspan fill="#d2a8ff">ConfigError    </tspan><tspan fill="#8b949e">secret &quot;payments-creds&quot; not found</tspan></text>
<text x="32" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#f85149">  ● </tspan><tspan fill="#e6edf3">api        </tspan><tspan fill="#d2a8ff">CrashLoop      </tspan><tspan fill="#8b949e">exit 1 · could not connect to postgres://app:[REDACTED]@db</tspan></text>
<text x="32" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#f85149">  ● </tspan><tspan fill="#e6edf3">web        </tspan><tspan fill="#d2a8ff">ImagePull      </tspan><tspan fill="#8b949e">busybox:9.9.9-does-not-exist: tag does not exist</tspan></text>
<text x="32" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#f85149">  ● </tspan><tspan fill="#e6edf3">worker     </tspan><tspan fill="#d2a8ff">OOMKilled      </tspan><tspan fill="#8b949e">killed at 32Mi limit, 4 restarts</tspan></text>
<text x="32" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#f85149">  ● </tspan><tspan fill="#e6edf3">batch      </tspan><tspan fill="#d2a8ff">Unschedulable  </tspan><tspan fill="#8b949e">0/1 nodes: Insufficient memory</tspan></text>
<text x="32" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#d29922">  ● </tspan><tspan fill="#e6edf3">checkout   </tspan><tspan fill="#d2a8ff">NotReady       </tspan><tspan fill="#8b949e">readiness probe failing, gets no traffic</tspan></text>
<text x="32" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#3fb950">⏺ </tspan><tspan fill="#8b949e">explain_pod · get_logs · rollout_status</tspan></text>
<text x="32" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#e6edf3">  6 root causes found. </tspan><tspan fill="#8b949e">api also logs DB_PASSWORD on boot (redacted) → rotate it.</tspan></text>
<text x="32" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" xml:space="preserve"><tspan fill="#3fb950">  Nothing changed. </tspan><tspan fill="#8b949e">Say the word and I&#x27;ll propose a plan.</tspan></text>

</svg>